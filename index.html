<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BizQuest Youth is a student-run organization that teaches coding, business, and AI, with chapters in Tennessee, New Jersey, and Delhi, India."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="canonical" href="https://bizquestyouth.org/" />
    <title>BizQuest Youth</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "BizQuest Youth",
        "alternateName": "BizQuest",
        "url": "https://bizquestyouth.org/",
        "foundingDate": "2025-04",
        "description": "BizQuest Youth is a student-run organization that teaches coding, business, and AI, with chapters in Tennessee, New Jersey, and Delhi, India.",
        "email": "contactbizquest@gmail.com",
        "telephone": "+1-901-319-5544",
        "founder": [
          { "@type": "Person", "name": "Aarush Ravichandran", "jobTitle": "Co-Founder and Chief Executive Officer" },
          { "@type": "Person", "name": "Uthej Katikaneni", "jobTitle": "Co-Founder and Chief Financial Officer" }
        ],
        "member": [
          { "@type": "OrganizationRole", "roleName": "Chief Executive Officer", "member": { "@type": "Person", "name": "Aarush Ravichandran" } },
          { "@type": "OrganizationRole", "roleName": "Chief Financial Officer", "member": { "@type": "Person", "name": "Uthej Katikaneni" } },
          { "@type": "OrganizationRole", "roleName": "Chief Operations Officer", "member": { "@type": "Person", "name": "Kushagra Dixit" } },
          { "@type": "OrganizationRole", "roleName": "Chief Growth Officer", "member": { "@type": "Person", "name": "Navneeth Manoj" } },
          { "@type": "OrganizationRole", "roleName": "Chief Marketing Officer", "member": { "@type": "Person", "name": "Avaneesh Chandran" } },
          { "@type": "OrganizationRole", "roleName": "Chief Technology Officer", "member": { "@type": "Person", "name": "Shreyan Seth" } }
        ]
      }
    </script>
  </head>
  <body>
    <!--
      Netlify detects forms at build time from the HTML. This hidden copy
      registers the Connect page form so submissions work from the SPA.
    -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="interest" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
